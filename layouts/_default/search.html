{{- define "main" }}

<div class="single-home search-page">
  <header class="single-page-head">
    <p class="kicker">Find something</p>
    <h1>{{ .Title }}</h1>
    {{- with .Description }}<p class="single-lede">{{ . }}</p>{{- end }}
  </header>
  <div id="searchbox" class="single-section">
    <label class="sr-only" for="searchInput">Search this site</label>
    <input id="searchInput" autofocus placeholder="{{ .Params.placeholder | default (printf "%s ↵" .Title) }}"
      aria-label="Search this site" type="search" autocomplete="off">
    <ul id="searchResults" aria-label="Search results"></ul>
  </div>
</div>

{{- end }}{{/* end main */}}
