<!DOCTYPE html>
<html lang="{{ site.Language }}" dir="{{ .Language.LanguageDirection | default "auto" }}">

<head>
    {{- partial "head.html" . }}
</head>

<body class="portfolio-page{{ if .IsHome }} home-page{{ end }}{{ if or (eq .Section "projects") (eq .Section "research") }} project-research-page{{ end }}{{ if eq site.Params.defaultTheme "dark" }} dark{{ end }}" id="top">
    {{- partial "portfolio-nav.html" . }}
    <main id="main-content" tabindex="-1" class="main portfolio-main">
        {{- block "main" . }}{{ end }}
    </main>
    {{- partial "portfolio-footer.html" . }}
    {{- partial "extend_footer.html" . }}
</body>
</html>
