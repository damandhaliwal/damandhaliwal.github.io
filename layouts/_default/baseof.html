<!DOCTYPE html>
<html lang="{{ site.Language }}" dir="{{ .Language.LanguageDirection | default "auto" }}">

<head>
    {{- partial "head.html" . }}
</head>

{{- $portfolio := or .IsHome (eq .Layout "about") (eq .Section "research") (eq .Section "projects") -}}
<body class="portfolio-page{{ if .IsHome }} home-page{{ end }}{{ if eq site.Params.defaultTheme "dark" }} dark{{ end }}" id="top">
    {{- partial "portfolio-nav.html" . }}
    <main id="main-content" tabindex="-1" class="main{{ if $portfolio }} portfolio-main{{ end }}">
        {{- block "main" . }}{{ end }}
    </main>
    {{- partial "portfolio-footer.html" . }}
    {{- partial "extend_footer.html" . }}
</body>
</html>
