{{- define "main" }}
<div class="single-home">
  <header class="single-page-head" aria-labelledby="research-title">
    <h1 id="research-title">Research</h1>
    <p class="single-lede">{{ .Description }}</p>
  </header>
  <section class="single-section" aria-label="Research papers">
    <ul class="single-list">
      {{- range .Pages.ByDate.Reverse }}
      <li>
        <h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
        <p class="single-meta">{{ .Params.topic }}{{ with .Date }} · {{ .Format "2006" }}{{ end }}</p>
        <p>{{ .Params.displaySummary | default .Description }}</p>
      </li>
      {{- end }}
    </ul>
  </section>
</div>
{{- end }}
