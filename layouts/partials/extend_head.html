<script>
(function () {
  try {
    var stored = localStorage.getItem("pref-theme");
    if (stored === "dark") {
      document.documentElement.classList.add("dark");
    } else if (!stored && window.matchMedia("(prefers-color-scheme: dark)").matches) {
      document.documentElement.classList.add("dark");
    }
  } catch (e) {}
})();
</script>
