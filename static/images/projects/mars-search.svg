<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Mars Water Search concept map</title>
  <desc id="desc">Four illustrative rover paths explore contour lines around a hidden deposit. This is a concept illustration, not a recorded simulation run.</desc>
  <defs>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0v38" stroke="#2E4756" stroke-opacity=".07"/></pattern>
    <clipPath id="map"><rect x="56" y="145" width="848" height="468" rx="2"/></clipPath>
    <path id="contour" d="M-134-10c-17-57 13-111 67-112 43-1 45-33 91-27 59 9 67 53 98 76 47 36 53 83 14 114-29 23-20 67-79 72-42 3-63 31-110 11-45-20-66-57-81-134Z"/>
  </defs>
  <path fill="#FAF8F2" d="M0 0h960v720H0z"/>
