    <text x="56" y="99" font-size="28" font-family="Georgia, serif">Explore. Share. Ask for help.</text>
    <text x="904" y="58" text-anchor="end" font-size="11" letter-spacing="1.5" fill="#6A7C85">FOUR AGENTS / ONE PRIZE</text>
  </g>
